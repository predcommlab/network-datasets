        - "Anatomical scale: Laminar / layer-specific"
        # end of generated: labels
  - type: dropdown
    id: labels_remove
    attributes:
      label: Labels to remove
      description: "Choose one or more labels the study should no longer have (multiple selections possible)."
      multiple: true
