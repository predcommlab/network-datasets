name: Change a label
description: Add, rename or remove one of the labels of a category, for example a new kind of stimulus. The filters on PredictIndex and the GitHub forms follow.
title: "Change a label"
labels: ["form: options"]
body:
  - type: markdown
    attributes:
      value: |
        Renaming or removing a label changes every study that has it; the reply lists them.

        To add, rename or remove a whole category, or to change its explanation, please use the form Change a category.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        # generated: categories (written by .github/scripts/predictindex.py sync from options.json; do not edit by hand)
        - "Species"
        - "Population"
        - "Age group"
        - "Task paradigm"
        - "Task-relevant vs. task-irrelevant"
        - "Type of prior"
        - "Induction of prior"
        - "Predictability"
        - "Volatility"
        - "Sensory modality"
        - "Stimulus properties"
        - "Stimulus quality"
        - "Recording technique"
        - "Anatomical scale"
        # end of generated: categories
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: What should change?
      options:
        - "Add a label"
        - "Rename a label"
        - "Remove a label"
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: Label as it is now
      description: "For Rename and Remove: the label as it is written now, for example Noisy (degraded)."
  - type: input
    id: new
    attributes:
      label: New label
      description: "For Add and Rename: the new wording. To add a label under another one, write both with a colon, for example Clinical: dyslexia. A label cannot contain a comma."
