name: Add a study
description: Add a study to PredictIndex, with its paper, its data and the labels that make it findable through the filters.
title: "Add a study"
labels: ["form: add"]
body:
  - type: markdown
    attributes:
      value: |
        Everything written in this form is public, like the rest of this repository. Please do not write e-mail addresses into it.

        If the study is not published yet, please leave Paper and Data empty: links are only shown once a study is published. When it is published, add them with the form Change a study.
  - type: input
    id: name
    attributes:
      label: Study name
      description: "A short name, shown as the title of the study on PredictIndex, for example Pupil & sound-pair familiarity."
    validations:
      required: true
  - type: input
    id: paper_title
    attributes:
      label: Paper title
      description: "Optional. When the paper is given as a DOI below, its title is looked up automatically, and this field can stay empty."
  - type: input
    id: authors
    attributes:
      label: Authors
      description: "As on the paper, with first and last names, separated by commas, for example Janika Becker, Christoph Korn, Helen Blank."
    validations:
      required: true
  - type: input
    id: corresponding_author
    attributes:
      label: Corresponding author
      description: "The first and last name of the corresponding author. PredictIndex can be filtered by this name."
    validations:
      required: true
  - type: dropdown
    id: published
    attributes:
      label: Is the study published (or available as a preprint)?
      options:
        - "Yes"
        - "Not yet"
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Paper
      description: "Only if the study is published: the DOI of the paper or preprint, for example 10.1038/s41598-024-59302-1, or a link to it."
  - type: input
    id: data
    attributes:
      label: Data
      description: "Only if the study is published: the link to the data, for example on OSF or OpenNeuro. Leave it empty if the data is not public."
  - type: input
    id: participants
    attributes:
      label: Number of participants
      description: "Optional, for example 30, or 30 (Exp. 1), 31 (Exp. 2)."
  - type: input
    id: sessions
    attributes:
      label: Number of sessions
      description: "Optional, for example 1."
  - type: markdown
    attributes:
      value: "The labels below make the study findable through the filters on PredictIndex. Tick all that apply; all of them are optional. If an option is missing, please write it under Notes for the maintainers at the end."
  # generated: label-checkboxes (written by .github/scripts/predictindex.py sync from options.json; do not edit by hand)
  - type: checkboxes
    id: label_species
    attributes:
      label: "Species"
      description: "(multiple selections possible)"
      options:
        - label: "Human"
        - label: "Macaque"
        - label: "Mouse"
        - label: "Rat"
        - label: "Simulated data"
  - type: checkboxes
    id: label_population
    attributes:
      label: "Population"
      description: "(multiple selections possible)"
      options:
        - label: "Healthy"
        - label: "Clinical: autism"
        - label: "Clinical: schizophrenia"
        - label: "Clinical: other"
  - type: checkboxes
    id: label_ageGroup
    attributes:
      label: "Age group"
      description: "(multiple selections possible)"
      options:
        - label: "Children"
        - label: "Adults"
        - label: "Older adults"
  - type: checkboxes
    id: label_paradigm
    attributes:
      label: "Task paradigm"
      description: "(multiple selections possible)"
      options:
        - label: "Oddball"
        - label: "Serial task"
        - label: "Recognition"
        - label: "Memory"
        - label: "Detection"
        - label: "Discrimination"
        - label: "Rating"
  - type: checkboxes
    id: label_taskRelevance
    attributes:
      label: "Task-relevant vs. task-irrelevant"
      description: "Task-relevant: the predicted stimulus or feature matters for the participant's task. Task-irrelevant: it does not, for example in passive viewing or listening. (multiple selections possible)"
      options:
        - label: "Task-relevant"
        - label: "Task-irrelevant"
  - type: checkboxes
    id: label_priorType
    attributes:
      label: "Type of prior"
      description: "(multiple selections possible)"
      options:
        - label: "Cue"
        - label: "Sequence"
        - label: "Natural environment"
        - label: "Schema"
  - type: checkboxes
    id: label_priorInduction
    attributes:
      label: "Induction of prior"
      description: "Implicit: learned through repetition. Explicit: instructed cues. Naturalistic / long-term: pre-existing knowledge. (multiple selections possible)"
      options:
        - label: "Implicit"
        - label: "Explicit"
        - label: "Naturalistic / long-term"
  - type: checkboxes
    id: label_predictability
    attributes:
      label: "Predictability"
      description: "(multiple selections possible)"
      options:
        - label: "Deterministic"
        - label: "Probabilistic / stochastic"
        - label: "Random"
  - type: checkboxes
    id: label_volatility
    attributes:
      label: "Volatility"
      description: "Do the priors change, so that they need updating? (multiple selections possible)"
      options:
        - label: "High"
        - label: "Low"
  - type: checkboxes
    id: label_modality
    attributes:
      label: "Sensory modality"
      description: "(multiple selections possible)"
      options:
        - label: "Auditory"
        - label: "Visual"
        - label: "Somatosensory"
        - label: "Cross-modal"
  - type: checkboxes
    id: label_stimulus
    attributes:
      label: "Stimulus properties"
      description: "(multiple selections possible)"
      options:
        - label: "Simple tones"
        - label: "Natural sounds"
        - label: "Gabor patches"
        - label: "Natural images"
        - label: "Video"
        - label: "Faces"
        - label: "Speech"
        - label: "Written text"
  - type: checkboxes
    id: label_stimulusQuality
    attributes:
      label: "Stimulus quality"
      description: "(multiple selections possible)"
      options:
        - label: "Distinct"
        - label: "Noisy (degraded)"
        - label: "Ambiguous (e.g. morphed)"
  - type: checkboxes
    id: label_technique
    attributes:
      label: "Recording technique"
      description: "(multiple selections possible)"
      options:
        - label: "Reaction times"
        - label: "Behavioural responses"
        - label: "Eye-tracking"
        - label: "Pupillometry"
        - label: "EEG"
        - label: "MEG"
        - label: "fMRI"
        - label: "fNIRS"
        - label: "ECoG"
        - label: "Single-unit"
        - label: "TMS"
  - type: checkboxes
    id: label_anatomicalScale
    attributes:
      label: "Anatomical scale"
      description: "(multiple selections possible)"
      options:
        - label: "Whole-brain"
        - label: "Region of interest (ROI)"
        - label: "Laminar / layer-specific"
  # end of generated: label-checkboxes
  - type: textarea
    id: google_form
    attributes:
      label: Answers from the Google Form
      description: "Please leave this empty. It is filled in automatically when this form is opened from the e-mail about a new answer in the Google Form."
  - type: textarea
    id: notes
    attributes:
      label: Notes for the maintainers
      description: "Optional. Not shown on PredictIndex, but public like everything in this form."
